name: TaxMap checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check frontend
        run: node --check assets/app.js && node --check assets/lookup.js
      - name: Syntax check Worker
        run: node --check worker/src/index.js
      - name: Unit tests
        run: cd worker && npm test
